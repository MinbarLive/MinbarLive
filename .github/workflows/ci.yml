name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs run with a read-only token and no access to secrets.
# Do NOT switch this to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # 30, not 20: the suite builds 345 real Qt windows and takes ~12 min on a
    # hosted runner, and 20 left no room for a slow one. A tight limit also
    # hides what actually went wrong — the first Qt run looked like a timeout
    # and was really a modal dialog blocking the whole job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately NOT fetching LFS: the three embedding files are
          # ~600 MB, and the free LFS bandwidth quota is 1 GB/month.
          # translation/rag.py degrades to "RAG unavailable" when the .npz
          # files are pointer stubs, and the suite passes that way.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

  # The same suite under a virtual X server. Linux users exist (the X11 icon
  # crash and the X11 mouse-wheel gap both arrived as bug reports from people
  # running from source), but every run so far was Windows-only, so Linux-only
  # breakage reached them instead of the pull request.
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # libportaudio2: the Linux sounddevice wheel does not bundle PortAudio.
      # xvfb: part of the suite builds real windows.
      # libegl1/libgl1: QtGui links against libEGL.so.1 and libGL.so.1, so
      # `import PySide6.QtWidgets` fails outright without them — before any
      # platform plugin is even considered. They are driver-adjacent and come
      # from the system on every desktop, which is why the AppImage does not
      # bundle them either (release.yml's clean-container check installs them
      # for the same reason).
      # The xcb set: since Qt 6.5 the xcb platform plugin has a hard dependency
      # on libxcb-cursor0 and will not load without the rest either — and a Qt
      # app whose only platform plugin fails to load cannot start at all.
      - name: System libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libportaudio2 xvfb libegl1 libgl1
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - run: pip install -r requirements.txt

      - run: xvfb-run -a python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install ruff==0.11.12

      # Changed files only: the repo carries pre-existing findings that are
      # deliberately "left as found", so a repo-wide check would be red on
      # day one. This enforces the standard on new code instead.
      - name: Ruff (changed files)
        shell: bash
        run: |
          files=$(git diff --name-only --diff-filter=ACMR \
            "origin/${{ github.base_ref }}...HEAD" -- '*.py')
          if [ -z "$files" ]; then
            echo "No Python files changed."
            exit 0
          fi
          echo "$files"
          ruff check $files
