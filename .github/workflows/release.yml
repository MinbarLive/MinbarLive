name: Release

# Builds the Windows EXE. Pushing a `v*` tag also publishes it as a release
# asset; `workflow_dispatch` builds without publishing, for testing the build
# itself. A second job builds an experimental Linux binary, which is kept as a
# workflow artifact and never attached to the release — see docs/ci.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `contents: write` is needed to create the release and upload the asset.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetched selectively below; `lfs: true` would pull all three
          # tracked files including the 418 MB raw JSON, which the EXE does
          # not bundle. See "Git LFS" in docs/ci.md.
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Runs before the LFS pull so the suite sees the same pointer stubs the
      # `test` job in ci.yml does: identical conditions, no surprise failures
      # from real embeddings being present.
      - name: Test
        run: python -m pytest -q

      - name: Check the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python -c "from version import __version__; print(__version__)")
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($ver)."
            echo "The in-app update check compares release tags against the built-in"
            echo "version, so a mismatch makes it prompt users forever or never."
            exit 1
          fi

      # Only the two embedding matrices the spec bundles (~182 MB), not the
      # 418 MB quran_embeddings.json, which a.datas filters out of the EXE.
      - name: Fetch embedding matrices from LFS
        run: git lfs pull --include="data/embeddings/*.npz"

      # An exhausted LFS bandwidth quota leaves ~130-byte pointer stubs behind
      # without failing the pull. The EXE would build fine and ship with Quran
      # verse matching silently dead, so fail here instead.
      - name: Verify the matrices are real
        shell: bash
        run: |
          for f in data/embeddings/quran_embeddings_openai.npz \
                   data/embeddings/quran_embeddings_gemini.npz; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is an LFS pointer stub ($size bytes), not the matrix."
              exit 1
            fi
            echo "$f: $size bytes"
          done

      # Handed to build-linux rather than letting that job run its own
      # `git lfs pull`: the two matrices are ~182 MB and the free LFS
      # allowance is 1 GB of bandwidth per month, so pulling them once per
      # release instead of twice is the difference between five builds a
      # month and two. compression-level 0 because .npz is already zipped.
      - name: Share the matrices with the Linux job
        uses: actions/upload-artifact@v7
        with:
          name: embeddings
          path: data/embeddings/*.npz
          compression-level: 0
          retention-days: 1

      - run: pyinstaller MinbarLive.spec

      - name: Verify the EXE
        shell: bash
        run: |
          size=$(stat -c%s dist/MinbarLive.exe)
          echo "dist/MinbarLive.exe: $size bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "::error::EXE is only $size bytes, the data/ bundle is missing."
            exit 1
          fi

      - name: Checksum
        shell: bash
        run: cd dist && sha256sum MinbarLive.exe | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: MinbarLive-exe
          path: |
            dist/MinbarLive.exe
            dist/SHA256SUMS.txt

      # The asset must keep the exact name MinbarLive.exe and the release must
      # be the "latest" one: the website's download buttons and the in-app
      # update check both go through releases/latest/download/MinbarLive.exe.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"

          # Always the first thing in the release description. `gh` prepends
          # --notes-file to whatever --generate-notes produces, so the
          # changelog follows underneath.
          cat > notes.md <<'EOF'
          **Windows**
          - "MinbarLive.exe" herunterladen
          - Download "MinbarLive.exe"

          **macOS** (experimentell / experimental — nur Apple Silicon / Apple Silicon only)
          - "MinbarLive-macos-arm64.zip" herunterladen, entpacken, `MinbarLive.app` nach "Programme" ziehen
          - Die App ist nicht signiert: beim ersten Start Rechtsklick auf die App → "Öffnen", dann im Dialog auf "Öffnen". Falls macOS sie ganz blockiert: Systemeinstellungen → Datenschutz & Sicherheit → "Trotzdem öffnen"
          - Download "MinbarLive-macos-arm64.zip", unzip it, move `MinbarLive.app` to Applications
          - The app is unsigned: on first launch right-click it → "Open", then confirm "Open". If macOS blocks it outright: System Settings → Privacy & Security → "Open Anyway"

          **Linux** (experimentell / experimental)
          - "MinbarLive-x86_64.AppImage" herunterladen, ausführbar machen (`chmod +x`), starten
          - Download "MinbarLive-x86_64.AppImage", make it executable (`chmod +x`), run it
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            # Release already exists, e.g. created through the web UI. Prepend
            # the block unless it is already there, never overwriting notes
            # somebody wrote by hand.
            body=$(gh release view "$tag" --json body -q .body)
            if ! printf '%s' "$body" | grep -qF 'Download "MinbarLive.exe"'; then
              printf '\n%s\n' "$body" >> notes.md
              gh release edit "$tag" --notes-file notes.md
            fi
          else
            gh release create "$tag" \
              --title "MinbarLive $tag" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi

          gh release upload "$tag" \
            dist/MinbarLive.exe dist/SHA256SUMS.txt --clobber

  # EXPERIMENTAL Linux build. Verified on a real Linux desktop (2026-07), so the
  # AppImage is now attached to tagged releases (the publish step at the end of
  # this job) - but it is still labelled experimental: several features are
  # Windows-only there (the OBS-visible borderless overlay, transparent static
  # mode, loopback capture), and the OS keychain needs a Secret Service backend
  # or every provider's API key is session-only (nothing is written to disk).
  # See docs/ci.md.
  build-linux:
    needs: build
    # NOT ubuntu-latest. A PyInstaller binary only starts on glibc at least as
    # new as the one it was built against, so building on 24.04 (glibc 2.39)
    # would exclude Debian 12, Ubuntu 22.04 and everything older. 22.04
    # (glibc 2.35) is the oldest runner GitHub still provides; if it is
    # retired, build inside a manylinux container rather than moving up.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # libportaudio2: the Linux sounddevice wheel does not bundle PortAudio,
      # so the spec bundles the system copy. xvfb: for the smoke launch below.
      #
      # libegl1/libgl1: QtGui links against libEGL.so.1 and libGL.so.1, so
      # `import PySide6.QtWidgets` fails on this machine without them — which
      # breaks PyInstaller's analysis pass, not just the smoke launch. They are
      # driver-adjacent and deliberately NOT bundled into the AppImage: every
      # desktop has its own, and shipping ours would override the user's GPU
      # driver. The clean-container check below installs them for that reason.
      #
      # libpulse0: `soundcard` loads libpulse through ctypes AT IMPORT, so
      # without it PyInstaller cannot import the module and skips both its
      # submodules and its own PyInstaller hook — silently, as a warning. The
      # AppImage then ships a soundcard that cannot be imported, and the Linux
      # device list loses the filter that hides JACK's output monitors and
      # application streams from the microphone dropdown. Same trap as libEGL:
      # a library missing on the BUILDER changes what gets bundled.
      #
      # The xcb set is a BUILD dependency, not just a test one: PyInstaller
      # bundles the shared libraries it finds the collected binaries linking
      # against, so Qt's xcb platform plugin only carries libxcb-cursor and
      # friends into the AppImage if they exist on this machine when the build
      # runs. Without them a user who has not installed anything gets a plugin
      # that will not load, Qt falls through to Wayland, and the subtitle
      # overlay can be neither placed on a screen nor kept on top. Never solve
      # that by telling users to install a package.
      - name: System libraries
        run: >
          sudo apt-get update && sudo apt-get install -y
          libportaudio2 libpulse0 xvfb libegl1 libgl1
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - run: pip install -r requirements.txt

      # The matrices the `build` job already pulled from LFS. They overwrite
      # the pointer stubs checkout left behind.
      #
      # Pinned at v7, not v8: v8 checks the Content-Type header before unzipping
      # and skips whatever it does not consider zipped. These .npz files have to
      # arrive EXTRACTED into data/embeddings — that hand-off is the only reason
      # this job does not run its own `git lfs pull`, which would cost another
      # ~182 MB against the 1 GB monthly allowance. Past v7 only with a build
      # that proves they still land unpacked.
      - uses: actions/download-artifact@v7
        with:
          name: embeddings
          path: data/embeddings

      - name: Verify the matrices are real
        run: |
          for f in data/embeddings/quran_embeddings_openai.npz \
                   data/embeddings/quran_embeddings_gemini.npz; do
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is an LFS pointer stub ($size bytes), not the matrix."
              exit 1
            fi
            echo "$f: $size bytes"
          done

      - run: pyinstaller MinbarLive.spec

      - name: Verify the binary
        run: |
          file dist/MinbarLive
          size=$(stat -c%s dist/MinbarLive)
          echo "dist/MinbarLive: $size bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "::error::Binary is only $size bytes, the data/ bundle is missing."
            exit 1
          fi

      # A hosted runner has no PulseAudio DAEMON, so soundcard_usable() returns
      # False and every smoke launch below took the DEGRADE branch: no loopback
      # devices, no JACK-monitor filtering, no call into libpulse at all. The
      # checks proved the app survives WITHOUT audio and said nothing about the
      # loopback feature the AppImage bundles soundcard for.
      #
      # That gap has already cost a release: the frozen build strips `assert`
      # (the spec's optimize=1), which removes soundcard's only guard against an
      # unreachable server, and a build aborted at startup with
      #   Assertion 'o' failed at ../src/pulse/operation.c:67 … Aborting.
      # A daemon here turns that class of crash into a failed smoke launch.
      #
      # DELIBERATELY AFTER pyinstaller. What must never happen is the builder's
      # libraries deciding what gets BUNDLED — that is the trap the xcb, libEGL
      # and libpulse notes above are about. Running a daemon for the launch is a
      # different step and cannot change the bundle, which is already built.
      - name: Start PulseAudio so the smoke launches exercise the audio path
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          pulseaudio --start --exit-idle-time=-1
          # A null sink gives the machine a monitor source, which is what a
          # loopback device actually is — without one there is nothing to find.
          pactl load-module module-null-sink sink_name=ci_sink
          # Fail loudly rather than quietly falling back. A daemon that did not
          # come up would put the launches below back on the degrade path and
          # report success — precisely the "passes without proving anything"
          # this step exists to remove.
          test -S "$XDG_RUNTIME_DIR/pulse/native" \
            || { echo "::error::No PulseAudio socket — the smoke launches would prove nothing."; exit 1; }
          # soundcard_usable() checks PULSE_SERVER first, then the socket path.
          # Export both so the frozen binary agrees with what we just started.
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "PULSE_SERVER=unix:$XDG_RUNTIME_DIR/pulse/native" >> "$GITHUB_ENV"
          echo "--- sources visible to the app ---"
          pactl list short sources

      # A startup crash — a shared library the bundle missed, an X11 request
      # the toolkit rejects, a libpulse call into a server that is now really
      # there — exits within seconds. A healthy start sits in the onboarding
      # wizard until `timeout` kills it, so exit 124 is the success case and
      # anything else means it died on its own.
      - name: Smoke-launch the binary
        run: |
          set +e
          xvfb-run -a timeout 30 ./dist/MinbarLive
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::MinbarLive exited with $code instead of staying up for 30s."
            exit 1
          fi
          echo "Stayed up for 30s."

      # appstreamcli is what appimagetool uses to VALIDATE the AppStream
      # metadata. Without it, appimagetool reports only that the file was found
      # ("appstreamcli command is missing, please install it") — so metadata
      # with, say, a non-reverse-DNS component id would ship looking fine and
      # be ignored by every software centre. ci.yml validates the same file on
      # every pull request; this is the check on the assembled tree.
      #
      # Installed after pyinstaller, for the same reason the PulseAudio daemon
      # is: nothing here may influence what got bundled.
      - name: AppStream validator
        run: sudo apt-get install -y appstream

      - name: Package AppImage
        run: bash packaging/build-appimage.sh

      # Deliberately NOT setting APPIMAGE_EXTRACT_AND_RUN, and the runner has no
      # FUSE installed: a clean start therefore proves the embedded uruntime
      # (FUSE-less) runtime works - i.e. an end user can double-click the
      # AppImage on a stock modern distro without installing libfuse2. A healthy
      # start sits in the onboarding wizard until timeout kills it (exit 124).
      - name: Smoke-launch the AppImage (no FUSE)
        run: |
          size=$(stat -c%s dist/MinbarLive-x86_64.AppImage)
          echo "dist/MinbarLive-x86_64.AppImage: $size bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "::error::AppImage is only $size bytes, the bundle is missing."
            exit 1
          fi
          set +e
          xvfb-run -a timeout 30 ./dist/MinbarLive-x86_64.AppImage
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited with $code (expected 124). The FUSE-less runtime may not be working."
            exit 1
          fi
          echo "AppImage stayed up for 30s without FUSE."

      # The step above cannot fail for a missing bundled library: it runs on the
      # machine that installed the xcb set so PyInstaller could find it, so it
      # passes whether or not those libraries actually reached the AppImage.
      # This one runs the same file where it matters — a container that has none
      # of them — and is the only check that speaks for a user who installed
      # nothing. Qt's xcb plugin failing to load is not fatal in an obvious way:
      # the app falls through to the Wayland plugin, which under xvfb means no
      # platform plugin at all, so the process dies immediately instead of
      # reaching the 30 s timeout.
      #
      # What the container gets is what every desktop already has (GL, ALSA,
      # fontconfig, D-Bus, an X server) and NOT one library from the Qt xcb set.
      # It also gets no PulseAudio daemon, unlike the two launches above — so
      # between them the two branches of soundcard_usable() are both covered:
      # up there the real libpulse path, down here the degrade path that a
      # machine without a sound server still has to survive. Do not "fix" this
      # one by starting a daemon in it; that would lose the degrade coverage.
      # --appimage-extract-and-run because a container has no FUSE; the
      # FUSE-less runtime is what the step above exists to prove.
      - name: Smoke-launch the AppImage where nothing is installed
        run: |
          set +e
          # The outer timeout is not belt-and-braces. `timeout` inside the
          # container signals only its own child, and --appimage-extract-and-run
          # forks: the extracted app survived as an orphan holding stdout open,
          # so `docker run` never returned and the step ran 24 minutes against a
          # 30-second limit before the job cap stopped it. Bound it out here,
          # where nothing the container does can interfere.
          timeout 360 docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -yqq --no-install-recommends \
              xvfb libglib2.0-0t64 libgl1 libegl1 libasound2t64 libfontconfig1 \
              libfreetype6 libdbus-1-3 >/dev/null
            echo "--- Qt xcb libraries present in this container (expect none) ---"
            for lib in libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                       libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
                       libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0; do
              dpkg -s "$lib" >/dev/null 2>&1 && echo "  $lib (pulled in as a dependency)"
            done
            echo "---"
            cd /tmp && cp /dist/MinbarLive-x86_64.AppImage . \
              && chmod +x MinbarLive-x86_64.AppImage
            # Extract FIRST, outside the run window. Unpacking 270 MB of
            # squashfs onto a container filesystem can take longer than the
            # window itself, and doing both under one `timeout 30` made a slow
            # extraction indistinguishable from an app that stayed up: the
            # timeout fired during extraction, exited 124, and this step read
            # 124 as success. It would have passed without ever launching the
            # app — in the one check that speaks for a user who installed
            # nothing.
            ./MinbarLive-x86_64.AppImage --appimage-extract >/dev/null
            set +e
            xvfb-run -a timeout 30 squashfs-root/AppRun
            rc=$?
            set -e
            if [ "$rc" -ne 124 ]; then
              echo "AppImage exited with $rc instead of staying up for 30 s."
              exit 1
            fi
            echo "Stayed up for 30 s after extraction."
          '
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::error::The clean-container check did not finish within 6 minutes. Something inside it is wedged - it is not a slow runner."
            exit 1
          fi
          # 0, not 124: the container script now decides for itself whether the
          # app stayed up and reports a plain pass/fail, so a timeout code can
          # never be mistaken for a successful launch again.
          if [ "$code" -ne 0 ]; then
            echo "::error::The AppImage did not survive 30 s on a machine with nothing installed (exit $code) - it is not self-contained. Check that the xcb libraries were installed BEFORE pyinstaller ran."
            exit 1
          fi
          echo "AppImage stayed up for 30s with none of the xcb libraries installed."

      # The AppImage is the only shipped Linux artifact: it wraps this same
      # binary and adds double-click-run + menu integration, so uploading the
      # bare binary too would just double the artifact size for no benefit. The
      # binary is still built and smoke-launched above as a base validation.
      - name: Checksum
        run: cd dist && sha256sum MinbarLive-x86_64.AppImage | tee SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: MinbarLive-linux
          path: |
            dist/MinbarLive-x86_64.AppImage
            dist/SHA256SUMS-linux.txt

      # Attach the experimental Linux AppImage to the release (tag builds only).
      # The Windows `build` job is a dependency and creates the release first,
      # so it already exists here - just upload alongside MinbarLive.exe.
      - name: Publish the AppImage to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/MinbarLive-x86_64.AppImage dist/SHA256SUMS-linux.txt --clobber

  # EXPERIMENTAL macOS build, attached to tagged releases since 2026-07-28 after
  # a real Mac verified the .app runs (same path the Linux AppImage took). It is
  # UNSIGNED and UN-NOTARIZED, so Gatekeeper blocks it on first launch and users
  # have to open it once via right-click → Open / Settings → Privacy & Security;
  # the release notes say so. Apple Silicon (arm64) only — it will not run on
  # Intel Macs. Known platform limits: loopback ("record what the speakers play")
  # does not exist on macOS, and the overlay cannot float above the Dock or the
  # menu bar, so it is laid out inside the usable screen area. See docs/ci.md.
  build-macos:
    needs: build
    # arm64. macos-14 is Apple Silicon; use it for a native, fast build. A single
    # x86_64 job (macos-13) would also cover Apple Silicon via Rosetta, but the
    # artifact is labelled arm64 to make the limitation explicit rather than
    # implying it is universal.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The matrices the `build` job already pulled from LFS. They overwrite the
      # pointer stubs checkout left behind (saves a second LFS pull — see the
      # note in the `build` job).
      - uses: actions/download-artifact@v7
        with:
          name: embeddings
          path: data/embeddings

      # macOS `stat` differs from GNU (`-f%z` not `-c%s`), so use `wc -c`, which
      # is portable across both this job and the Linux one's tooling.
      - name: Verify the matrices are real
        run: |
          for f in data/embeddings/quran_embeddings_openai.npz \
                   data/embeddings/quran_embeddings_gemini.npz; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is an LFS pointer stub ($size bytes), not the matrix."
              exit 1
            fi
            echo "$f: $size bytes"
          done

      # ONEDIR here (MinbarLive.spec says why): produces dist/MinbarLive/ — the
      # collected directory — and dist/MinbarLive.app, which is the artifact.
      # dist/MinbarLive is NOT an executable any more; nothing below may run it.
      - run: pyinstaller MinbarLive.spec

      - name: Verify the .app bundle
        run: |
          test -d dist/MinbarLive.app || { echo "::error::MinbarLive.app was not produced."; exit 1; }
          # Measure the WHOLE bundle, not Contents/MacOS/MinbarLive. Under
          # onedir that file is a small launcher stub and the payload lives in
          # Contents/Frameworks and Contents/Resources, so the old
          # binary-size check would fail on a perfectly correct build.
          size=$(du -sk dist/MinbarLive.app | cut -f1)
          echo "dist/MinbarLive.app: $size KiB"
          if [ "$size" -lt 100000 ]; then
            echo "::error::The bundle is only $size KiB, the data/ payload is missing."
            exit 1
          fi
          # Size alone is a proxy. These are what the size is standing in for,
          # and the reason the payload moving is worth checking directly: the
          # matrices are ~182 MB of the bundle and Quran verse matching dies
          # silently without them.
          for f in quran_embeddings_openai.npz quran_embeddings_gemini.npz; do
            found=$(find dist/MinbarLive.app -name "$f" | head -1)
            if [ -z "$found" ]; then
              echo "::error::$f is not inside the bundle — RAG would ship dead."
              exit 1
            fi
            echo "  $found"
          done
          # The mic-usage string is REQUIRED — without it macOS hard-kills the app
          # the moment it opens an input stream (TCC). Fail if the spec did not
          # wire it into Info.plist.
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
            dist/MinbarLive.app/Contents/Info.plist \
            || { echo "::error::NSMicrophoneUsageDescription missing from Info.plist."; exit 1; }

      # `ditto` is the macOS-correct archiver — it preserves the bundle's symlinks
      # and permissions where `zip` would mangle them. --keepParent keeps the
      # MinbarLive.app/ top level inside the archive.
      - name: Package the .app
        run: ditto -c -k --keepParent dist/MinbarLive.app dist/MinbarLive-macos-arm64.zip

      - name: Checksum
        run: cd dist && shasum -a 256 MinbarLive-macos-arm64.zip | tee SHA256SUMS-macos.txt

      # Uploaded BEFORE the smoke launch, and that ORDER is the point: the
      # launch below is fatal now, so a crashing build still leaves an artifact
      # to download and debug. What it does not leave is a published release —
      # the publish step comes after, and a failed job never reaches it.
      - uses: actions/upload-artifact@v7
        with:
          name: MinbarLive-macos
          path: |
            dist/MinbarLive-macos-arm64.zip
            dist/SHA256SUMS-macos.txt

      # FATAL, not best-effort. This was `continue-on-error: true` reporting a
      # ::warning::, which meant a macOS build that crashed at startup was still
      # uploaded AND still attached to the release — the check could not fail
      # anything it was there to protect.
      #
      # The hedge was reasonable when written: nobody had established that a Qt
      # GUI can start on a hosted macOS runner's session at all, so a red job
      # would more likely have meant "the runner cannot do this" than "the app
      # is broken". That is settled now — consecutive dispatch builds both
      # report "Stayed up for 25s." — so an early exit means the app.
      #
      # macOS has no `timeout`, so launch in the background and kill after a
      # grace period; exiting on its own before then means it crashed at startup.
      #
      # Launched from INSIDE the bundle. It used to run ./dist/MinbarLive, which
      # under onedir is a directory — the step would have failed on a good
      # build. Running the bundle's own binary is also the better test: it is
      # the file users actually execute, on the paths it will really resolve.
      - name: Smoke-launch the .app
        run: |
          ./dist/MinbarLive.app/Contents/MacOS/MinbarLive >/tmp/mac_smoke.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then
            echo "Stayed up for 25s."
            kill "$pid" 2>/dev/null || true
          else
            wait "$pid"; code=$?
            echo "::error::MinbarLive exited early with $code — see the log below."
            cat /tmp/mac_smoke.log || true
            exit 1
          fi

      # Attach the macOS bundle to the release (tag builds only). The Windows
      # `build` job is a dependency and creates the release first, so it already
      # exists here — just upload alongside MinbarLive.exe, like the AppImage.
      - name: Publish the .app to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/MinbarLive-macos-arm64.zip dist/SHA256SUMS-macos.txt --clobber
